name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Get project files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" "$PWD/build/android/open-world-mobile.apk"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: open-world-mobile-debug-apk
          path: build/android/open-world-mobile.apk
          if-no-files-found: error
          retention-days: 7
